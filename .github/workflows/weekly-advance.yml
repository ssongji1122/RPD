name: Weekly Advance — 매주 화요일 주차 업데이트

on:
  schedule:
    # 매주 화요일 01:00 UTC = KST 10:00 (수업 시작)
    # 주의: GitHub는 정각 cron을 수 시간 지연하거나 드롭할 수 있음.
    # 아래 로직은 "날짜에서 주차를 직접 계산"하는 idempotent 방식이라
    # 늦게 돌아도/여러 번 돌아도/하루 건너뛰어도 항상 올바른 주차로 수렴함.
    - cron: '0 1 * * 2'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '변경 없이 계산 결과만 확인 (dry run)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  actions: write  # deploy-pages.yml을 workflow_dispatch로 트리거하기 위함

jobs:
  advance-week:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compute & set active week (date-anchored)
        id: advance
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          python3 - <<'EOF'
          import json, os, re
          from datetime import date, datetime, timezone

          # ── 학사 일정 ──────────────────────────────────────────────────────
          # 과거 "매주 +1" 방식은 휴강을 모르고 드리프트가 누적됐다.
          # (2026-05-05 어린이날 휴강에 봇이 그대로 +1 → 한 주 밀림. 수동 보정
          #  커밋을 봇이 3시간 뒤 덮어쓴 사고.) 그래서 날짜에서 직접 계산한다.
          # 다음 학기 운영 시 아래 두 값만 갱신하면 됨.
          SEMESTER_START = date(2026, 3, 3)   # Week 1 화요일
          HOLIDAYS = [date(2026, 5, 5)]       # 어린이날(화) 휴강 — 수업 없는 화요일
          LAST_WEEK = 15

          today = datetime.now(timezone.utc).date()
          raw = (today - SEMESTER_START).days // 7 + 1
          skipped = sum(1 for h in HOLIDAYS if h <= today)
          target = max(1, min(raw - skipped, LAST_WEEK))
          print(f"오늘(UTC): {today} → 계산된 active 주차: Week {target}")

          def status_for(w):
              return 'done' if w < target else ('active' if w == target else 'upcoming')

          dry = os.environ.get('DRY_RUN', 'false').lower() == 'true'

          # 1) weeks/site-data.json
          with open('weeks/site-data.json') as f:
              site = json.load(f)
          for it in site:
              it['status'] = status_for(it['week'])
          if not dry:
              with open('weeks/site-data.json', 'w') as f:
                  json.dump(site, f, ensure_ascii=False, indent=2)

          # 2) course-site/data/curriculum.json
          with open('course-site/data/curriculum.json') as f:
              cur = json.load(f)
          for it in cur:
              it['status'] = status_for(it['week'])
          if not dry:
              with open('course-site/data/curriculum.json', 'w') as f:
                  json.dump(cur, f, ensure_ascii=False, indent=2)

          # 3) course-site/data/overrides.json
          with open('course-site/data/overrides.json') as f:
              ov = json.load(f)
          for wk, meta in ov['weeks'].items():
              meta['status'] = status_for(int(wk))
          if not dry:
              with open('course-site/data/overrides.json', 'w') as f:
                  json.dump(ov, f, ensure_ascii=False, indent=2)

          # 4) course-site/data/curriculum.js (텍스트 — week 객체의 status만 치환)
          with open('course-site/data/curriculum.js') as f:
              js = f.read()
          for w in range(1, LAST_WEEK + 1):
              pat = re.compile(r'("week": ' + str(w) + r',\n    "status": ")(?:done|active|upcoming)(")')
              js, n = pat.subn(r'\g<1>' + status_for(w) + r'\g<2>', js, count=1)
              if n != 1:
                  raise SystemExit(f"ERROR: curriculum.js에서 Week {w} status 패턴을 찾지 못함 (matched={n})")
          if not dry:
              with open('course-site/data/curriculum.js', 'w') as f:
                  f.write(js)

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"target_week={target}\n")
              f.write(f"dry_run={'true' if dry else 'false'}\n")
          if dry:
              print(f"[DRY RUN] Week {target} 로 설정될 예정 (파일은 변경하지 않음).")
          EOF

      - name: Commit and push if changed
        if: steps.advance.outputs.dry_run != 'true'
        env:
          TARGET_WEEK: ${{ steps.advance.outputs.target_week }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            weeks/site-data.json \
            course-site/data/curriculum.json \
            course-site/data/curriculum.js \
            course-site/data/overrides.json
          if git diff --staged --quiet; then
            echo "변경 없음 — 이미 Week ${TARGET_WEEK}. 커밋 건너뜀 (idempotent)."
          else
            git commit -m "chore(curriculum): set active week to Week ${TARGET_WEEK} (date-anchored)"
            git push origin main
            # status 변경을 라이브에 반영. github-actions[bot]의 GITHUB_TOKEN push는
            # deploy-pages.yml의 push 트리거를 발동시키지 못하므로(루프 방지 정책) 명시 트리거한다.
            gh workflow run deploy-pages.yml --ref main
            echo "deploy-pages 트리거됨 — Week ${TARGET_WEEK} 라이브 반영."
          fi
