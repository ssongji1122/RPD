name: Deploy to GitHub Pages

# web/ (Astro 후속 사이트)를 GitHub Pages 로 배포한다. course-site 를 대체.
# web/ 는 빌드 타임에 weeks/site-data.json, course-site/data, course-site/assets
# 를 읽으므로 그 데이터가 갱신될 때도 재배포되도록 트리거에 포함한다.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'weeks/**'
      - 'course-site/data/**'
      - 'course-site/assets/showme/**'
      - 'course-site/assets/final-projects/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # Astro 6 requires Node >=22.12.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        working-directory: web
        run: npm ci

      - name: Build Astro site
        working-directory: web
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
